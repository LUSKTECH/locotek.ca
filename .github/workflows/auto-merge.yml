name: Auto Merge Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit-verification: true

      - name: Wait for all other checks to settle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Waiting for checks on $PR_URL..."
          # Give other workflows time to start
          sleep 30
          # Wait up to 10 minutes for all checks (other than this job) to complete
          for i in $(seq 1 20); do
            PENDING=$(gh pr checks "$PR_URL" --json name,state --jq '[.[] | select(.state == "PENDING" and (.name | contains("auto-merge") | not))] | length')
            if [ "$PENDING" = "0" ]; then
              echo "All checks completed."
              break
            fi
            echo "Still $PENDING check(s) pending, waiting 30s... (attempt $i/20)"
            sleep 30
          done

      - name: Verify all checks passed
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          FAILED=$(gh pr checks "$PR_URL" --json name,state --jq '[.[] | select((.state == "FAILURE" or .state == "ERROR") and (.name | contains("auto-merge") | not))] | length')
          if [ "$FAILED" != "0" ]; then
            echo "Some checks failed, skipping merge."
            exit 0
          fi
          echo "all_passed=true" >> "$GITHUB_OUTPUT"

      - name: Approve PR
        if: steps.verify.outputs.all_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL" || true

      - name: Merge PR
        if: steps.verify.outputs.all_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
